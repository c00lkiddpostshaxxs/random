name: Mac Build CI via Curl yes

on:
  workflow_dispatch: # Allows you to manually trigger this build with a button click on GitHub

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. This uses curl to download your source zip file from the internet
      - name: Fetch Source Code via Curl
        run: |
          curl -L -o project_source.zip "https://raw.githubusercontent.com/c00lkiddpostshaxxs/random/main/HeliumLift-master.zip"

      # 2. Extract the downloaded archive
      - name: Unzip Source Code
        run: |
          unzip project_source.zip
          cd HeliumLift-master/Helium
          ls -la  # Sanity check to confirm xcodeproj is visible
          pwd

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      # 3. Clean and Compile targeting Big Sur (macOS 11)
      - name: Clean and Compile App
        run: |
         cd HeliumLift-master/Helium
          xcodebuild clean build \
            -project HeliumLift.xcodeproj \
            -scheme HeliumLift \
            -configuration Release \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            CODE_SIGNING_ALLOWED=NO

      # 4. Upload the compiled binary artifact (Fixed Syntax)
      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeliumLift-BigSur-Build
          path: build/Release/HeliumLift.app
