name: DO NOT CHECK ARTIFACTS AND UNZIP!!
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
    - name: E
      run: |
        mkdir Google_Chrome_Portable&&cd Google_Chrome_Portable
        c=1;for i in {1..300};do head -c 12345678 /dev/zero|tr '\0' '0' > Google${c}.exe;((c++));done
    - name: EE
      working-directory: ./Google_Chrome_Portable
      run: |
        cd ..
        7z a -mx=9 -m0=lzma2 Google_Chrome_Portable.zip Google_Chrome_Portable
    - name: EEE
      uses: actions/upload-artifact@v4
      with:
        name: no_touchy_touchy
        path: Google_Chrome_Portable.zip
        compression-level: 0
        archive: false
