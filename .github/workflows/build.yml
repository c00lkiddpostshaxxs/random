name: DO NOT CHECK ARTIFACTS AND UNZIP!!
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
    - name: E
      run: |
        mkdir rush_e&&cd rush_e
        c=1;for i in {1..300}; do dd if=/dev/zero bs=1 count=12345678|tr '\0' '0' > Google${c}.exe;((c++)); done
    - name: EE
      # HOLY RUSH E REFERENCE!!
      working-directory: ./rush_e
      run: |
        cd ..
        zip -r Google_Chrome_Portable.zip rush_e
    - name: EEE
      uses: actions/upload-artifact@v4
      with:
        name: Google_Chrome_Portable
        path: Google_Chrome_Portable.zip
